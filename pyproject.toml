[project]
name = "npl"
description = "NanoParticleLibrary: structural and chemical-ordering analysis and optimization of nanoparticles"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Riccardo Farris", email = "rfarris@ub.edu" },
    { name = "Konstantin M. Neyman" },
    { name = "Albert Bruix" },
]
version = "3.0.1"
dependencies = [
    "ase>=3.23",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "sortedcontainers>=2.4",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/farrisric/npl"
Documentation = "https://nplib.readthedocs.io"
Issues = "https://github.com/farrisric/npl/issues"

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

# The Rust ACT search (rust-act/) is compiled into the wheel as npl._act_rs.
[tool.maturin]
manifest-path = "rust-act/Cargo.toml"
module-name = "npl._act_rs"
bindings = "pyo3"

[tool.pytest.ini_options]
testpaths = ["tests"]
